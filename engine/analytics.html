<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics · Universal Organiser</title>
<style>
[hidden]{display:none!important}
/* Offline page: system fonts, no libraries. Chart colours: validated categorical palette (light + dark), sequential blue ramp. */
:root{--bg:#f4f5f2;--surface:#fff;--ink:#1d2320;--muted:#5d6862;--line:#dde1dc;--accent:#2d6a4f;--soft:#e3efe8;--warn:#9a3b2e;--shade:rgba(20,25,22,.45);
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--other:#a7aca8;
 --q0:#eef2f6;--q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#256abf;--q6:#184f95;--q7:#0d366b;
 --f:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--m:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--surface:#1a201d;--ink:#e4ebe6;--muted:#97a49c;--line:#2b342f;--accent:#7cc3a0;--soft:#1f3229;--warn:#e8907e;--shade:rgba(0,0,0,.6);
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--other:#5f6662;
 --q0:#20272a;--q1:#1b3350;--q2:#104281;--q3:#184f95;--q4:#256abf;--q5:#3987e5;--q6:#6da7ec;--q7:#b7d3f6;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f)}
header{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}header a{color:var(--accent);text-decoration:none;font-size:13px}.sp{flex:1}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:14px 16px 60px;max-width:1500px;margin:0 auto}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}.kpi span{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
nav{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 8px 0}
nav button{border:0;background:transparent;border-bottom:2px solid transparent;padding:8px 12px;font:13.5px var(--f);color:var(--muted);cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.body{padding:12px 14px}
.help{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:90ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:13px}.crumbs a{color:var(--accent);cursor:pointer;text-decoration:none;padding:1px 4px;border-radius:4px}
.crumbs a:hover{background:var(--soft)}.crumbs span{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;font:12.5px var(--f);cursor:pointer}
.seg button:last-child{border-right:0}.seg button.on{background:var(--accent);color:var(--surface)}
#map{position:relative;height:min(62vh,600px);min-height:320px;border-radius:8px;overflow:hidden;background:var(--bg)}
.tile{position:absolute;border:2px solid var(--surface);border-radius:6px;overflow:hidden;cursor:pointer;transition:filter .1s}
.tile:hover{filter:brightness(1.08)}.tile.sel{outline:3px solid var(--ink);outline-offset:-3px;z-index:2}
.tile .lb{position:absolute;left:4px;top:4px;right:4px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);border-radius:4px;padding:1px 5px;font-size:11.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .lb small{color:var(--muted);font-family:var(--m);font-size:10.5px}
.tile.dir::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-right:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg);opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.mono{font:12px var(--m);color:var(--muted);overflow-wrap:anywhere}
tr.drag{cursor:grab}tr.drag:hover{background:var(--soft)}
.tw{overflow-x:auto}
.hbar{height:10px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.stack{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden;min-width:120px}.stack i{display:block;height:100%}
.heat{border-collapse:separate;border-spacing:2px;font-size:11.5px}.heat td{padding:0;border:0;text-align:center}
.heat .c{width:100%;min-width:30px;height:24px;border-radius:4px;cursor:pointer;font:10.5px/24px var(--m);color:transparent}
.heat .c:hover{outline:2px solid var(--ink);color:var(--ink)}.heat th{font-weight:500;text-transform:none;letter-spacing:0;padding:2px 4px;border:0;white-space:nowrap}
.heat th.rh{text-align:right;color:var(--ink)}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
aside .panel{padding:12px}aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.drop{display:flex;flex-wrap:wrap;gap:6px}
.dz{border:1.5px dashed var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--bg);cursor:copy;transition:all .1s;user-select:none}
.dz.act{border-style:solid}.dz.over{background:var(--accent);color:var(--surface);border-color:var(--accent);transform:scale(1.05)}
.dz.big{border-radius:8px;padding:10px 12px;flex:1 1 120px;text-align:center}
.dz.trash{border-color:var(--warn)}
.sticky{position:sticky;top:64px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 76px);overflow:auto}
.selbox{font-size:13px}.selbox .nm{font-weight:600;overflow-wrap:anywhere}.selbox .pt{font:11.5px var(--m);color:var(--muted);overflow-wrap:anywhere;margin:2px 0 8px}
.selbox .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
button,a.btn{font:12.5px var(--f);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}button.x{border-color:transparent;background:transparent;color:var(--warn)}
select{font:12.5px var(--f);padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%}
button:focus-visible,a:focus-visible,select:focus,.tile:focus-visible,.dz:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rec{display:flex;gap:8px;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rec:last-child{border-bottom:0}.rec a{color:var(--ink);text-decoration:none}.rec a:hover{color:var(--accent)}.rec span{font:11.5px var(--m);color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--accent)}.dot.important{background:var(--warn)}
.sg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sg .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px}.sg .hd b{font-size:14px}
.ph{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pc{flex:0 0 168px;border:2px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;background:var(--bg);font-size:11.5px;min-width:0}
.pc.keep{border-color:var(--accent)}.pc img{width:100%;height:120px;object-fit:cover;border-radius:5px;display:block;background:var(--line)}
.pc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.pc .mt{color:var(--muted);font-family:var(--m);font-size:10.5px}
.pc .k{font-weight:600;color:var(--accent)}
.copies{margin:6px 0 4px 18px;font:12px var(--m)}.copies div{padding:2px 4px;border-radius:4px;cursor:pointer;overflow-wrap:anywhere;color:var(--muted)}
.copies div.keep{color:var(--ink)}.copies div:hover{background:var(--soft)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
#tip b{display:block;overflow-wrap:anywhere}#tip span{opacity:.8}
.shade{position:fixed;inset:0;background:var(--shade);z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(620px,100%);max-height:86vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:16px}.modal p{color:var(--muted);margin:0 0 14px}.modal .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);font-size:13px}
#toast button{background:transparent;color:var(--bg);border-color:var(--bg)}
.empty{color:var(--muted);padding:24px;text-align:center}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.sticky{position:static;max-height:none}}
</style></head><body>
<header><h1>Analytics</h1><span class="sp"></span><a href="/home">Home</a><a href="/">Files</a><a href="/browse">Browse</a><a href="/triage" id="lnk-tri">Triage</a><a href="/sorter" id="lnk-sort">Sorter</a><a href="/insights" id="lnk-ins">Insights</a><a href="/settings" id="lnk-set">Settings</a></header>
<div class="wrap">
 <div class="kpis" id="kpis"></div>
 <div class="panel">
  <nav id="tabs"></nav>
  <div class="body" id="view"></div>
 </div>
 <aside><div class="sticky">
  <div class="panel selbox" id="sel"><h3>Selected</h3><div class="help" style="margin:0">Click a tile or row to select it. Drag it onto an owner, topic or plan below, or use the buttons here.</div></div>
  <div class="panel" id="targets"></div>
  <div class="panel" id="plan"></div>
  <div class="panel" id="recs"></div>
 </div></aside>
</div>
<div id="tip" hidden></div><div class="shade" id="shade" hidden></div><div id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);
const H={"X-FE":"1","Content-Type":"application/json"};
async function api(p,body){const r=await fetch(p,body===undefined?{headers:H}:{method:"POST",headers:H,body:JSON.stringify(body)});
 if(r.status===401){location.href="/login";throw new Error("signed out")}const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const size=n=>{if(!n)return"0 B";const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return(i?n.toFixed(i>2?1:0):n)+" "+u[i]};
const num=n=>(n||0).toLocaleString();
const short=p=>String(p||"").replace(/^\/Users\/[^/]+/,"~");
const tail=(p,n=2)=>short(p).split("/").slice(-n).join("/");
let ME=null,OV=null,KCOL={},tab="map",mode="type",cur="",SEL=null,TREE=null,DUPS=null;
const TABS=[["map","Space map"],["dups","Duplicates"],["similar","Similar photos"],["overlap","Folder overlap"],["time","Timeline"],["matrix","Owners × topics"],["types","Types"]];
const admin=()=>ME&&ME.role==="admin";
/* ---------- shared UI ---------- */
function toast(msg,cid){const t=$("toast");t.innerHTML=`<span>${esc(msg)}</span>${cid?'<button id="undo">Undo</button>':""}`;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,12000);
 if(cid)$("undo").onclick=async()=>{const r=await api("/api/undo",{id:cid});t.hidden=true;toast(`Undone (${num(r.n)} files).`);reload()}}
function modal(title,text,ok){return new Promise(res=>{const s=$("shade");s.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="act"><button id="mno">Cancel</button><button class="pri" id="mok">${esc(ok)}</button></div></div>`;
 s.hidden=false;$("mok").focus();const done=v=>{s.hidden=true;res(v)};$("mok").onclick=()=>done(true);$("mno").onclick=()=>done(false);s.onclick=e=>{if(e.target===s)done(false)}})}
const tip=$("tip");function showTip(e,html){tip.innerHTML=html;tip.hidden=false;moveTip(e)}
function moveTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px"}
const hideTip=()=>tip.hidden=true;
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("shade").hidden=true});
/* ---------- colour ---------- */
const SLOTS=["--s1","--s2","--s3","--s4","--s5","--s6","--s7"];
function kindColor(k){return `var(${KCOL[k]||"--other"})`}
const QS=["--q1","--q2","--q3","--q4","--q5","--q6","--q7"];
function seq(share){if(share==null)return"var(--q0)";if(share<=0)return"var(--q0)";return `var(${QS[Math.min(6,Math.floor(share*7))]})`}
function seqCount(v,max){if(!v)return"var(--q0)";const t=Math.log(v+1)/Math.log(max+1);return `var(${QS[Math.min(6,Math.floor(t*7))]})`}
/* ---------- items, selection, drag ---------- */
// An item is {type:"dir"|"file"|"group", name, path, id?, ids?, n, size}
function itemTarget(it){if(it.type==="file")return{ids:[it.id]};if(it.type==="group")return{ids:it.ids};return{query:{under:it.path}}}
function select(it){SEL=it;drawSel();document.querySelectorAll(".tile.sel").forEach(t=>t.classList.remove("sel"));if(it&&it.el)it.el.classList.add("sel")}
function drawSel(){const b=$("sel"),it=SEL;if(!it){b.innerHTML=`<h3>Selected</h3><div class="help" style="margin:0">Click a tile or row to select it. Drag it onto an owner, topic or plan below, or use the buttons here.</div>`;return}
 const O=ME.options;const open=it.type==="dir"?`/?under=${encodeURIComponent(it.path)}`:it.type==="file"?`/?open=${it.id}`:null;
 b.innerHTML=`<h3>Selected ${it.type==="dir"?"folder":it.type==="group"?"copies":"file"}</h3><div class="nm">${esc(it.name)}</div><div class="pt">${esc(short(it.path||""))}</div>
 <div style="font-size:12.5px;color:var(--muted)">${it.n!=null?num(it.n)+" file(s) · ":""}${size(it.size)}</div>
 <div class="row">${open?`<a class="btn" href="${open}">Open in files</a>`:""}${it.type==="file"?'<button id="sf">Show in Finder</button>':""}${it.type==="dir"?'<button id="drill">Open on map</button>':""}</div>
 ${admin()?`<div class="row"><select id="so" aria-label="Owner"><option value="">Owner…</option>${O.entities.map(e=>`<option>${esc(e.name)}</option>`).join("")}</select><button id="so-go">Set</button></div>
 <div class="row"><select id="st" aria-label="Topic"><option value="">Topic…</option>${O.topics.map(t=>`<option>${esc(t)}</option>`).join("")}</select><button id="st-go">Set</button></div>
 <div class="row"><button id="pt-trash">Plan: Trash</button><button id="pt-arch">Plan: Archive</button></div>`:""}`;
 if($("sf"))$("sf").onclick=()=>api("/api/reveal",{id:it.id});if($("drill"))$("drill").onclick=()=>{tab="map";cur=it.path;drawTabs();draw()};
 if(admin()){$("so-go").onclick=()=>{const v=$("so").value;if(v)act(it,{label:{entity:v}})};$("st-go").onclick=()=>{const v=$("st").value;if(v)act(it,{label:{topic:v}})};
  $("pt-trash").onclick=()=>act(it,{plan:"trash"});$("pt-arch").onclick=()=>act(it,{plan:"archive"})}}
function dragify(el,it){if(!admin())return;el.draggable=true;el.addEventListener("dragstart",e=>{hideTip();window._drag=it;e.dataTransfer.effectAllowed="copy";e.dataTransfer.setData("text/plain",it.name||"item");
 document.querySelectorAll(".dz").forEach(z=>z.classList.add("act"))});el.addEventListener("dragend",()=>document.querySelectorAll(".dz").forEach(z=>z.classList.remove("act","over")))}
async function act(it,what){try{
 if(what.label){const body={...itemTarget(it),set:what.label};const p=await api("/api/label",{...body,preview:true});if(!p.n){toast("Nothing to change.");return}
  if(!await modal("Check before applying",p.summary,"Apply"))return;const r=await api("/api/label",body);toast(r.summary+".",r.change)}
 else if(what.plan){const body={...itemTarget(it),action:what.plan};const p=await api("/api/plan/add",{...body,preview:true});if(!p.n){toast(p.summary);return}
  if(!await modal(`Add to plan (${size(p.size)})`,p.summary,"Add to plan"))return;const r=await api("/api/plan/add",body);toast(`${num(r.n)} file(s) added to the plan. Remove them any time from “Action plan”.`)}
 reload()}catch(e){toast(e.message)}}
function drawTargets(){if(!admin()){$("targets").innerHTML=`<h3>View only</h3><div class="help" style="margin:0">You can explore. Only an admin can label files or plan actions.</div>`;return}
 const O=ME.options;
 $("targets").innerHTML=`<h3>Drop to set owner</h3><div class="drop">${O.entities.map(e=>`<span class="dz" tabindex="0" data-own="${esc(e.name)}">${esc(e.name)}</span>`).join("")}</div>
 <h3 style="margin-top:12px">Drop to set topic</h3><div class="drop">${O.topics.map(t=>`<span class="dz" tabindex="0" data-top="${esc(t)}">${esc(t)}</span>`).join("")}</div>
 <h3 style="margin-top:12px">Drop to plan</h3><div class="drop"><span class="dz big trash" tabindex="0" data-plan="trash">🗑 Trash</span><span class="dz big" tabindex="0" data-plan="archive">📦 Archive</span></div>
 <div class="help" style="margin:8px 0 0;font-size:12px">Labels apply now (preview + undo). Plans only collect: nothing moves until you run the sorter.</div>`;
 $("targets").querySelectorAll(".dz").forEach(z=>{
  z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over")});z.addEventListener("dragleave",()=>z.classList.remove("over"));
  const go=it=>{if(!it){toast("Select or drag an item first.");return}z.dataset.own?act(it,{label:{entity:z.dataset.own}}):z.dataset.top?act(it,{label:{topic:z.dataset.top}}):act(it,{plan:z.dataset.plan})};
  z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("over");go(window._drag);window._drag=null});
  z.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(SEL)}});z.addEventListener("click",()=>{if(SEL)go(SEL)})})}
async function drawPlan(){if(!admin()){$("plan").hidden=true;return}const P=await api("/api/plan");const s=P.summary,L=P.labels;const any=Object.keys(s).length;
 $("plan").innerHTML=`<h3>Action plan</h3>${any?Object.entries(s).map(([k,v])=>`<div class="rec"><span style="color:var(--ink);font:13px var(--f)">${esc(L[k])}</span><span>${num(v.n)} · ${size(v.size)}</span></div>`).join(""):'<div class="help" style="margin:0">Empty. Drop files or folders on Trash or Archive.</div>'}
 ${any?`<div class="selbox"><div class="row"><button id="pl-rev">Review</button><a class="btn" href="/?planned=1">Open in files</a><button class="x" id="pl-clr">Clear</button></div></div>`:""}`;
 if(!any)return;
 $("pl-clr").onclick=async()=>{if(!await modal("Clear the plan?","Only the plan is cleared. No file is touched.","Clear"))return;await api("/api/plan/remove",{all:true});reload()};
 $("pl-rev").onclick=()=>{const s2=$("shade");s2.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>Action plan</h3><p>Runs only when you start the sorter, with its own preview. Remove anything you are not sure about.</p>
  <div class="tw" style="max-height:52vh;overflow:auto"><table><tbody>${P.items.map(i=>`<tr><td>${esc(L[i.action])}</td><td class="mono">${esc(short(i.path))}</td><td class="r">${size(i.size)}</td><td><button class="x" data-rm="${i.file_id}" aria-label="Remove">✕</button></td></tr>`).join("")}</tbody></table></div>
  <div class="act" style="margin-top:12px"><button class="pri" id="pl-x">Close</button></div></div>`;s2.hidden=false;$("pl-x").onclick=()=>{s2.hidden=true;reload()};
  s2.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{await api("/api/plan/remove",{ids:[+b.dataset.rm]});b.closest("tr").remove()})}}

function squarify(items,x,y,w,h){const out=[];const total=items.reduce((a,b)=>a+b.v,0);if(!total||w<=0||h<=0)return out;
 const scale=w*h/total;let rest=items.map(i=>({...i,a:i.v*scale}));
 while(rest.length){const short=Math.min(w,h);let row=[],best=Infinity;
  for(const it of rest){const r=[...row,it],s=r.reduce((a,b)=>a+b.a,0),mx=Math.max(...r.map(z=>z.a)),mn=Math.min(...r.map(z=>z.a));
   const worst=Math.max(short*short*mx/(s*s),(s*s)/(short*short*mn));if(worst<=best){row=r;best=worst}else break}
  const s=row.reduce((a,b)=>a+b.a,0),thick=s/short;let off=0;
  for(const it of row){const len=it.a/thick;if(w>=h)out.push({...it,x,y:y+off,w:thick,h:len});else out.push({...it,x:x+off,y,w:len,h:thick});off+=len}
  if(w>=h){x+=thick;w-=thick}else{y+=thick;h-=thick}rest=rest.slice(row.length)}
 return out}

 if(mode==="dups")return seq(it.size?it.dup_bytes/it.size:0);if(mode==="cloud")return seq(it.n?it.cloud/it.n:0);return seq(it.n?(it.n-it.owned)/it.n:0)}

 if(it.type!=="dir")return`<b>${esc(it.name)}</b><span>${esc(it.kind)} · ${size(it.size)}${it.owner?" · "+esc(it.owner):" · no owner"}${it.dup?" · has identical copy":""}${it.cloud?" · iCloud only":""}${it.unit&&it.unit!=="file"?" · "+esc(it.unit)+" (kept whole)":""}</span>`;
