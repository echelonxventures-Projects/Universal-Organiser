<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up · Universal Organiser</title>
<style>
[hidden]{display:none!important}
:root{--bg:#f4f5f2;--surface:#fff;--ink:#1d2320;--muted:#5d6862;--line:#dde1dc;--accent:#2d6a4f;--soft:#e3efe8;--warn:#9a3b2e;--warnsoft:#f6e4e0;--amber:#8a6100;--ambersoft:#fbf0d6;
 --f:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--m:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--surface:#1a201d;--ink:#e4ebe6;--muted:#97a49c;--line:#2b342f;--accent:#7cc3a0;--soft:#1f3229;--warn:#e8907e;--warnsoft:#3a2420;--amber:#e8c26e;--ambersoft:#3a3020;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}.sp{flex:1}header a{color:var(--accent);text-decoration:none;font-size:13px}
main{max-width:820px;margin:0 auto;padding:20px 16px 120px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:0;list-style:none;font-size:12.5px}
.steps li{padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.steps li.on{border-color:var(--accent);color:var(--ink);font-weight:600}.steps li.done{color:var(--accent)}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
h2{font-size:18px;margin:0 0 6px}p.help{color:var(--muted);margin:0 0 16px;font-size:13.5px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--bg)}
.card:has(input:checked){border-color:var(--accent);background:var(--soft)}
.card input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}.card b{display:block;margin-bottom:2px}.card span{font-size:12.5px;color:var(--muted)}
.chk{display:grid;grid-template-columns:20px 1fr auto;gap:4px 10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}.chk .ic{font-weight:700;text-align:center}.chk .t{font-weight:600}.chk .d{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ok{color:var(--accent)}.bad{color:var(--warn)}.soft{color:var(--amber)}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.req{border-color:var(--warn);color:var(--warn)}
code{font:12.5px var(--m);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
.fold{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.fold input{accent-color:var(--accent);width:16px;height:16px;flex:none}.fold .p{font:12px var(--m);color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:11px;border-radius:4px;padding:0 6px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
input[type=text],select{font:14px var(--f);padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.row>input[type=text]{flex:1;min-width:200px}
button{font:14px var(--f);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}button:disabled{opacity:.5;cursor:default}
button.x{border-color:transparent;background:transparent;color:var(--warn);padding:6px 8px}
.foot{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.note{background:var(--ambersoft);border-radius:8px;padding:10px 12px;font-size:13px;margin:12px 0}
.err{background:var(--warnsoft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin:12px 0}
dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;margin:0;font-size:13.5px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.people .pr{display:grid;grid-template-columns:1fr 160px auto;gap:8px;margin-bottom:6px}
@media (max-width:560px){.people .pr{grid-template-columns:1fr 120px auto}.chk{grid-template-columns:20px 1fr}.chk .pill{grid-column:2}}
</style></head><body>
<header><h1>Universal Organiser</h1><span class="n" id="ver" style="font:12px var(--m);color:var(--muted)"></span><span class="sp"></span><a href="/home" id="skip" hidden>Skip to Home</a></header>
<main>
<ol class="steps" id="steps"></ol>
<section id="box"></section>
<div class="foot"><button id="back">Back</button><button class="pri" id="next">Next</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const H={"X-FE":"1","Content-Type":"application/json"};
async function api(p,body){const r=await fetch(p,body===undefined?{headers:H}:{method:"POST",headers:H,body:JSON.stringify(body)});
 if(r.status===401){location.href="/login";throw new Error("signed out")}const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEPS=["Check","Use","Country","Folders","People","Computers","Review","Scan"];
let W=null,step=0;
const A={preset:"personal",region:"none",roots:[],library:"",you:"",people:[],role:"standalone",access:"local",custom:[]};
const OS={macos:"Mac",windows:"Windows PC",linux:"Linux computer"};

function steps(){$("steps").innerHTML=STEPS.map((s,i)=>`<li class="${i===step?"on":i<step?"done":""}">${i<step?"✓ ":""}${s}</li>`).join("");
 $("back").hidden=step===0||step===7;$("next").textContent=step===6?"Save":step===7?"Go to Home":"Next"}

function checksHTML(cs){const icon=c=>c.status==="ok"?'<span class="ic ok">✓</span>':c.status==="info"?'<span class="ic">·</span>':c.need==="required"?'<span class="ic bad">✗</span>':'<span class="ic soft">!</span>';
 return cs.map(c=>`<div class="chk">${icon(c)}<div><div class="t">${esc(c.title)}</div>${c.detail?`<div class="d">${esc(c.detail)}</div>`:""}
 ${c.status!=="ok"&&c.fix?`<div class="d">${esc(c.fix)}${c.cmd?` <code>${esc(c.cmd.join(" "))}</code>`:""}</div>`:""}
 ${c.fixable&&c.status!=="ok"?`<div style="margin-top:6px"><button data-fix="${esc(c.id)}">Build it now</button></div>`:""}</div>
 ${c.status==="ok"?"":`<span class="pill ${c.need==="required"?"req":""}">${esc(c.need)}</span>`}</div>`).join("")}

function draw(){steps();const b=$("box");$("next").disabled=false;
 if(step===0){const bad=W.checks.filter(c=>c.status==="missing"&&c.need==="required");
  b.innerHTML=`<h2>Welcome</h2><p class="help">This ${OS[W.os]||"computer"} (${esc(W.hostname)}) will keep an encrypted catalogue of your files: names, dates, owners, topics and the text inside documents and photos. It never sends anything to the internet, and it never moves a file without showing you a preview first. Each change can be undone.</p>
  <h3 style="font-size:14px;margin:0 0 4px">What this computer has</h3>${checksHTML(W.checks)}
  ${bad.length?`<div class="err">${bad.length} required item(s) missing. Fix them, then press “Check again”.</div><div class="row"><button id="again">Check again</button></div>`:""}`;
  $("next").disabled=bad.length>0;
  b.querySelectorAll("[data-fix]").forEach(x=>x.onclick=async()=>{x.disabled=true;x.textContent="Building… (a few minutes)";try{await api("/api/doctor/fix",{id:x.dataset.fix});W.checks=await api("/api/doctor");draw()}catch(e){x.textContent=e.message}});
  if($("again"))$("again").onclick=async()=>{W.checks=await api("/api/doctor");draw()}}
 if(step===1){b.innerHTML=`<h2>How will you use it?</h2><p class="help">A starting point. Folder names, people types and topics can all be changed later in Settings.</p>
  <div class="cards">${W.presets.map(p=>`<label class="card"><input type="radio" name="pre" value="${esc(p.id)}" ${A.preset===p.id?"checked":""}><div><b>${esc(p.title)}</b><span>${esc(p.about)}</span></div></label>`).join("")}</div>`;
  b.querySelectorAll("[name=pre]").forEach(x=>x.onchange=()=>A.preset=x.value)}
 if(step===2){b.innerHTML=`<h2>Which country are your papers from?</h2><p class="help">Adds that country's identity and tax documents, its tax year and its speech languages. Everything else works the same everywhere.</p>
  <div class="cards">${W.regions.map(r=>`<label class="card"><input type="radio" name="reg" value="${esc(r.id)}" ${A.region===r.id?"checked":""}><div><b>${esc(r.title)}</b><span>${esc(r.about||"Passport, driving licence, bank, tax, insurance, medical, travel… in any country.")}</span></div></label>`).join("")}</div>
  <p class="help" style="margin-top:14px">Your country is not listed? Choose International. A country pack is one small file (profiles/regions); the manual explains how to add one.</p>`;
  b.querySelectorAll("[name=reg]").forEach(x=>x.onchange=()=>A.region=x.value)}
 if(step===3){const kinds={home:"on this computer",cloud:"cloud folder",network:"network share",removable:"external drive"};
  const all=[...W.folders,...A.custom.map(p=>({path:p,real:p,kind:"custom",label:p.split(/[\\/]/).filter(Boolean).pop()||p}))];
  b.innerHTML=`<h2>Which folders should it look at?</h2><p class="help">Only reading. Program folders, app libraries and hidden folders are skipped by themselves. Folders with code (git, package.json…) are kept together as projects and never sorted.</p>
  ${all.map(f=>`<label class="fold"><input type="checkbox" value="${esc(f.path)}" ${A.roots.includes(f.path)?"checked":""}><div><b>${esc(f.label)}</b> <span class="tag">${esc(kinds[f.kind]||"added by you")}</span><div class="p">${esc(f.real)}</div></div></label>`).join("")}
  <div class="row"><input type="text" id="add" placeholder="Another folder, e.g. D:/Papers or /mnt/nas/family"><button id="addb">Add</button></div>
  <p class="help" style="margin:4px 0 0">Network shares: connect them first (Finder → Connect to Server, File Explorer → Map network drive, or your Linux file manager), then they appear here. Another computer can also send its own catalogue: see the “Computers” step.</p>
  <h3 style="font-size:14px;margin:18px 0 4px">Where sorted files go</h3><p class="help" style="margin-bottom:6px">Only when you run the Sorter and approve its plan.</p><input type="text" id="lib" value="${esc(A.library)}">`;
  b.querySelectorAll(".fold input").forEach(x=>x.onchange=()=>{A.roots=x.checked?[...new Set([...A.roots,x.value])]:A.roots.filter(r=>r!==x.value);$("next").disabled=!A.roots.length});
  $("addb").onclick=()=>{const v=$("add").value.trim();if(v&&!A.custom.includes(v)){A.custom.push(v);A.roots.push(v)}draw()};
  $("lib").oninput=e=>A.library=e.target.value;$("next").disabled=!A.roots.length}
 if(step===4){const types=(W.entity_types||["Self","Family"]).filter(t=>t!=="Self");
  b.innerHTML=`<h2>Whose files are these? <span style="font-weight:400;color:var(--muted);font-size:14px">(optional)</span></h2>
  <p class="help">Names help it find the owner of a document (the name printed on an ID, a payslip, a policy…). It never guesses: unsure files wait for you in Triage. Add more later in Settings → Owners.</p>
  <label style="font-size:13px;color:var(--muted)">Your name</label><input type="text" id="you" value="${esc(A.you)}" placeholder="e.g. Alex Smith" style="margin:4px 0 14px">
  <div class="people" id="pl">${A.people.map((p,i)=>`<div class="pr"><input type="text" data-i="${i}" data-k="name" value="${esc(p.name)}" placeholder="Name"><select data-i="${i}" data-k="type">${types.map(t=>`<option ${p.type===t?"selected":""}>${esc(t)}</option>`).join("")}</select><button class="x" data-del="${i}" aria-label="Remove">✕</button></div>`).join("")}</div>
  <button id="addp">Add a person or organisation</button>`;
  $("you").oninput=e=>A.you=e.target.value;
  $("addp").onclick=()=>{A.people.push({name:"",type:types[0]||"Family"});draw()};
  b.querySelectorAll("[data-k]").forEach(x=>x.oninput=x.onchange=()=>A.people[+x.dataset.i][x.dataset.k]=x.value);
  b.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{A.people.splice(+x.dataset.del,1);draw()})}
 if(step===5){b.innerHTML=`<h2>One computer, or several?</h2><p class="help">Files always stay on the computer they are on. Only the catalogue is shared, over your own network, encrypted.</p>
  <div class="cards">
  <label class="card"><input type="radio" name="role" value="standalone" ${A.role==="standalone"?"checked":""}><div><b>Just this computer</b><span>Search and sort the files on this computer.</span></div></label>
  <label class="card"><input type="radio" name="role" value="hub" ${A.role==="hub"?"checked":""}><div><b>The hub</b><span>This computer also collects the catalogues of other computers at home, so one search covers all of them.</span></div></label>
  <label class="card"><input type="radio" name="role" value="agent" ${A.role==="agent"?"checked":""}><div><b>Send to a hub</b><span>Another computer is the hub. This one scans its own files and sends its catalogue there.</span></div></label></div>
  <h3 style="font-size:14px;margin:20px 0 6px">Who can open the page?</h3><div class="cards">
  <label class="card"><input type="radio" name="acc" value="local" ${A.access==="local"?"checked":""}><div><b>Only this computer</b><span>Safest. Nothing listens on the network.</span></div></label>
  <label class="card"><input type="radio" name="acc" value="lan" ${A.access==="lan"?"checked":""}><div><b>Home Wi-Fi</b><span>Phones, tablets and other computers at home, over HTTPS. Each new device must be approved here with a 6-digit code.</span></div></label>
  <label class="card"><input type="radio" name="acc" value="remote" ${A.access==="remote"?"checked":""}><div><b>Also away from home</b><span>Only through your own VPN (Tailscale or WireGuard). Never opened to the internet.</span></div></label></div>
  <div id="accnote"></div>`;
  const note=()=>{$("accnote").innerHTML=(A.role==="hub"&&A.access==="local")?'<div class="note">A hub needs “Home Wi-Fi” (or “Also away from home”) so the other computers can reach it.</div>':
   A.access==="remote"?'<div class="note">Install Tailscale or WireGuard on this computer and on your phone first. The page then also listens on the VPN address only. Your router is not changed and no port is opened to the internet.</div>':
   A.role==="agent"?'<div class="note">After saving, pair this computer with the hub: on the hub open <b>Computers → Add a computer</b>, then type the command it shows into a terminal here.</div>':"";
   $("next").disabled=A.role==="hub"&&A.access==="local"};
  b.querySelectorAll("[name=role]").forEach(x=>x.onchange=()=>{A.role=x.value;if(x.value==="hub"&&A.access==="local"){A.access="lan";b.querySelector("[name=acc][value=lan]").checked=true}note()});
  b.querySelectorAll("[name=acc]").forEach(x=>x.onchange=()=>{A.access=x.value;note()});note()}
 if(step===6){const P=W.presets.find(p=>p.id===A.preset),R=W.regions.find(r=>r.id===A.region);const ppl=[A.you,...A.people.map(p=>p.name)].filter(Boolean);
  b.innerHTML=`<h2>Check and save</h2><p class="help">Saved to your own profile on this computer. The old one, if any, is kept so it can be restored from Settings.</p>
  <dl><dt>Use</dt><dd>${esc(P?P.title:A.preset)}</dd><dt>Country</dt><dd>${esc(R?R.title:A.region)}</dd><dt>Folders</dt><dd>${A.roots.map(esc).join("<br>")}</dd>
  <dt>Sorted files</dt><dd>${esc(A.library)}</dd><dt>People</dt><dd>${ppl.length?ppl.map(esc).join(", "):"none yet"}</dd>
  <dt>This computer</dt><dd>${{standalone:"Just this computer",hub:"The hub",agent:"Sends to a hub"}[A.role]}</dd><dt>Page</dt><dd>${{local:"Only this computer",lan:"Home Wi-Fi",remote:"Home Wi-Fi + your VPN"}[A.access]}</dd></dl><div id="serr"></div>`}
 if(step===7){b.innerHTML=`<h2>First scan</h2><p class="help">Reads your folders once; later scans only look at what changed. You can use the page while it runs.</p>
  <div class="bar"><i id="bar"></i></div><p id="st" class="help">Starting…</p><div id="after"></div>`;$("next").disabled=true;poll()}}

async function poll(){try{const s=await api("/api/scan/status");const st=s.status||{};const j=s.job||{};
 const pct=st.phase==="analysing"&&st.total?Math.round(100*st.done/st.total):st.phase==="done"?100:5;$("bar").style.width=pct+"%";
 $("st").textContent=j.phase==="failed"?"The scan stopped: "+j.error:st.phase==="listing"?`Listing files… ${(st.found||0).toLocaleString()} so far`:st.phase==="analysing"?`Reading ${st.done.toLocaleString()} of ${st.total.toLocaleString()} new or changed files`:st.phase==="done"&&j.phase==="done"?"Done.":"Working…";
 if(j.phase==="done"||j.phase==="failed"){$("next").disabled=false;
  if(A.role==="agent")$("after").innerHTML='<div class="note">Next: pair with the hub. On the hub open <b>Computers → Add a computer</b> and type the command it shows into a terminal on this computer.</div>';
  else if(A.role==="hub")$("after").innerHTML='<div class="note">Next: add your other computers on the <a href="/computers">Computers</a> page.</div>';return}
 }catch(e){$("st").textContent=e.message}setTimeout(poll,1500)}

$("back").onclick=()=>{if(step>0){step--;draw()}};
$("next").onclick=async()=>{
 if(step===6){$("next").disabled=true;try{const people=A.people.filter(p=>p.name.trim());
   await api("/api/welcome/save",{preset:A.preset,region:A.region,roots:A.roots,library:A.library,you:A.you.trim(),people,role:A.role,access:A.access});
   await api("/api/scan/start",{});step=7;draw()}catch(e){$("serr").innerHTML=`<div class="err">${esc(e.message)}</div>`;$("next").disabled=false}return}
 if(step===7){location.href="/home";return}
 step++;draw()};

(async()=>{W=await api("/api/welcome");$("ver").textContent="version "+W.version;$("skip").hidden=!W.setup_done;
 const c=W.current||{};A.preset=c.preset||A.preset;A.region=c.region||A.region;A.role=c.role||A.role;A.access=c.access||A.access;A.library=c.library||W.library;
 A.roots=c.roots&&c.roots.length?c.roots:W.folders.filter(f=>f.suggested).map(f=>f.path);A.custom=A.roots.filter(r=>!W.folders.some(f=>f.path===r));
 const self=(c.people||[]).find(p=>p.type==="Self");A.you=self?self.name:"";A.people=(c.people||[]).filter(p=>p!==self);draw()})();
</script></body></html>
